summary: |
  Chain.Love provides a curated list of Web3 services that can be seamlessly embedded into your documentation.
  All data comes from an open-source, community-maintained database where any developer can contribute.
  This widget is designed for blockchain networks looking to enhance developer experience and onboarding while reducing the effort spent on maintaining service documentation.
  Chain.Love supports all networks listed in its public GitHub repository — if you notice a missing network or service provider, simply submit a PR and contribute to the public good.

